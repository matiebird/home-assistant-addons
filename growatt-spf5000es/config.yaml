name: Growatt SPF5000ES
description: >-
  Poll a Growatt SPF 5000 ES inverter over Modbus/RS485 and publish telemetry,
  configuration state, and Home Assistant MQTT discovery using the upstream
  spf5000es-server service.
version: "0.1.2"
slug: growatt_spf5000es
url: https://github.com/matiebird/home-assistant-addons
init: false
uart: true
startup: services
boot: auto
arch:
  - aarch64
  - amd64
services:
  - mqtt:need
discovery:
  - mqtt
options:
  serial_port: /dev/ttyUSB0
  modbus_timeout_sec: 1.5
  log_level: INFO
  mqtt_client_id: growatt_spf5000es
  mqtt_keepalive_sec: 60
  mqtt_will_delay_sec: 300
  mqtt_operation_timeout_sec: 10
  mqtt_disconnect_timeout_sec: 5
  mqtt_topic_prefix: growatt/spf5000es
  mqtt_ha_discovery_prefix: homeassistant
  mqtt_ha_device_id: growatt_spf5000es
  mqtt_ha_device_name: Growatt SPF 5000 ES
  polling_config_interval_sec: 600
  polling_status_interval_sec: 2
  recovery_reconnect_attempts: 3
  recovery_initial_backoff_sec: 1
  recovery_max_backoff_sec: 10
  recovery_reset_cooldown_sec: 300
schema:
  serial_port: device(subsystem=tty)
  modbus_timeout_sec: float(0.1,)
  log_level: list(DEBUG|INFO|WARN|ERROR)
  mqtt_client_id: str
  mqtt_keepalive_sec: int(1,65535)
  mqtt_will_delay_sec: int(1,)
  mqtt_operation_timeout_sec: float(0.1,)
  mqtt_disconnect_timeout_sec: float(0.1,)
  mqtt_topic_prefix: str
  mqtt_ha_discovery_prefix: str
  mqtt_ha_device_id: str
  mqtt_ha_device_name: str
  polling_config_interval_sec: int(1,)
  polling_status_interval_sec: int(1,)
  recovery_reconnect_attempts: int(1,20)
  recovery_initial_backoff_sec: int(1,)
  recovery_max_backoff_sec: int(1,)
  recovery_reset_cooldown_sec: int(1,)
